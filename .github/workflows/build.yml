name: MSBuild CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: msbuild -t:restore

    - name: Build Solution
      run: msbuild nxconvert.sln /p:Configuration=Release /p:Platform=x64

    - name: Prepare Artifact
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Copy-Item x64/Release/nxconvert.exe dist/nxconvert.exe
        @'
        [Settings]
        keys=
        '@ | Set-Content -Encoding ASCII dist/nxconvert.sample.ini

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nxconvert-windows-x64
        path: dist/
